site_name: Chaai Labs Documentation
site_url: https://chaailabs.github.io/docs/
site_description: HPC-native agentic AI and validated scientific workflow execution
repo_name: chaailabs/chaailabs.github.io
repo_url: https://github.com/chaailabs/chaailabs.github.io
docs_dir: documentation
site_dir: build/docs
strict: true
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo-icon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
  features: [navigation.instant, navigation.instant.progress, navigation.sections, navigation.tabs, navigation.tabs.sticky, navigation.top, navigation.footer, content.code.copy, content.code.annotate, search.highlight, search.suggest, toc.follow]
extra_css:
  - assets/stylesheets/chaai.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chaailabs
      name: Chaai Labs on GitHub
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Chaai Labs ↗: https://chaailabs.github.io/
  - Documentation: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - First workflow: getting-started/first-workflow.md
      - Safety model: getting-started/safety.md
  - Chaai:
      - Overview: chaai/index.md
      - Architecture: chaai/architecture.md
      - Tools and backends: chaai/tools-and-backends.md
      - Maturity: chaai/maturity.md
  - HPCA engine:
      - Overview: hpca/index.md
      - Architecture: hpca/architecture.md
      - Workflow stages: hpca/workflow-stages.md
      - Handler reference: hpca/handlers.md
      - Analysis and mathematics: hpca/analysis-and-mathematics.md
      - State and recovery: hpca/state-and-recovery.md
      - Provenance: hpca/provenance.md
  - Workflows:
      - Battery materials: workflows/battery-materials.md
      - MLIP lifecycle: workflows/mlip-lifecycle.md
  - Operations:
      - Observability: operations/observability.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - Project specification: reference/project-specification.md
      - Analysis outputs: reference/analysis-outputs.md
      - Scientific formulas: reference/scientific-formulas.md
      - Terminology: reference/terminology.md
  - Development:
      - Documentation policy: development/documentation-policy.md
      - Testing and releases: development/testing-and-releases.md
      - Security: development/security.md
copyright: Copyright &copy; 2026 <a href="https://chaailabs.github.io/">Chaai Labs</a>
