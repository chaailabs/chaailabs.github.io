<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="#0A0E1A"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- C-shape node network, scaled to 200x200 with padding -->
  <!-- Nodes: N0(158,28) N1(100,20) N2(48,52) N3(28,100) N4(48,148) N5(100,172) N6(158,164) -->

  <!-- Connection lines (outer C spine) -->
  <g stroke="#00FF88" stroke-width="2.5" opacity="0.35" filter="url(#glow-soft)">
    <line x1="158" y1="28"  x2="100" y2="20"/>
    <line x1="100" y1="20"  x2="48"  y2="52"/>
    <line x1="48"  y1="52"  x2="28"  y2="100"/>
    <line x1="28"  y1="100" x2="48"  y2="148"/>
    <line x1="48"  y1="148" x2="100" y2="172"/>
    <line x1="100" y1="172" x2="158" y2="164"/>
  </g>

  <!-- Cross-links (network density) -->
  <g stroke="#00FF88" stroke-width="1.5" opacity="0.18" filter="url(#glow-soft)">
    <line x1="158" y1="28"  x2="48"  y2="52"/>
    <line x1="100" y1="20"  x2="28"  y2="100"/>
    <line x1="48"  y1="52"  x2="48"  y2="148"/>
    <line x1="28"  y1="100" x2="100" y2="172"/>
    <line x1="48"  y1="148" x2="158" y2="164"/>
    <line x1="100" y1="20"  x2="100" y2="172"/>
  </g>

  <!-- Node circles with glow -->
  <g filter="url(#glow)">
    <circle cx="158" cy="28"  r="9"  fill="#00FF88"/>
    <circle cx="100" cy="20"  r="8"  fill="#00FF88"/>
    <circle cx="48"  cy="52"  r="8"  fill="#00FF88"/>
    <circle cx="28"  cy="100" r="11" fill="#00FF88"/>
    <circle cx="48"  cy="148" r="8"  fill="#00FF88"/>
    <circle cx="100" cy="172" r="8"  fill="#00FF88"/>
    <circle cx="158" cy="164" r="9"  fill="#00FF88"/>
  </g>

  <!-- Inner ring glow on center node -->
  <circle cx="28" cy="100" r="18" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.2"/>
  <circle cx="28" cy="100" r="26" fill="none" stroke="#00FF88" stroke-width="0.5" opacity="0.08"/>
</svg>
